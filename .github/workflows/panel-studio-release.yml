name: Publish Panel Studio Windows
on:
  push:
    branches: [panel-studio-release-v1.0.0]
    paths: [package.json, scripts/publish-release.cjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/geometry.test.cjs
      - run: npm run package:win
      - name: Verify and publish release assets
        run: node scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ github.token }}
